<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe Menu</title>
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <div class="menu">

        <main>
            <h1>Restaurant CAFE</h1>
            <p class="established">Est. 2020</p>
            <hr>

            <section>
                <h2>Coffee</h2>
                <div class="coffee-icon">☕</div>

                <article class="item">
                    <p class="flavor">French Vanilla</p>
                    <p class="price">3.00</p>
                </article>

                <article class="item">
                    <p class="flavor">Caramel Macchiato</p>
                    <p class="price">3.75</p>
                </article>

                <article class="item">
                    <p class="flavor">Cortado</p>
                    <p class="price">3.50</p>
                </article>

                <article class="item">
                    <p class="flavor">Cappuccino</p>
                    <p class="price">4.00</p>
                </article>

                <article class="item">
                    <p class="flavor">Espresso</p>
                    <p class="price">4.50</p>
                </article>
            </section>

            <section>
                <h2>Sweet Treats and Pastries</h2>

                <article class="item">
                    <p class="dessert">Gajar ka halwa</p>
                    <p class="price">1.50</p>
                </article>

                <article class="item">
                    <p class="dessert">Cherry Pie</p>
                    <p class="price">2.75</p>
                </article>

                <article class="item">
                    <p class="dessert">Cheesecake</p>
                    <p class="price">3.00</p>
                </article>

                <article class="item">
                    <p class="dessert">Barfi</p>
                    <p class="price">2.50</p>
                </article>
            </section>
        </main>

        <hr class="bottom-line">

        <footer>
            <p>
                <a href="https://www.MyRestaurant.org">
                    Visit our Restaurant website
                </a>
            </p>
            <p class="address">123456789 Code Drive</p>
        </footer>

    </div>
</body>

</html>
